name: Build Windows

on:
  # Run automatically when a new release/tag is published
  release:
    types: [published]
  # Also allow manual trigger
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to attach artifact to (e.g. v2.10.40). Leave blank to just upload as artifact.'
        required: false

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installer
        run: npm run electron:build:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows installer as artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            dist/*.exe
            dist/*.zip
          retention-days: 30

      - name: Attach to GitHub Release
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && github.event.inputs.tag != '')
        shell: pwsh
        run: |
          $tag = if ("${{ github.event_name }}" -eq "release") { "${{ github.ref_name }}" } else { "${{ github.event.inputs.tag }}" }
          $files = Get-ChildItem -Path "dist" -Filter "*.exe" | Select-Object -ExpandProperty FullName
          foreach ($file in $files) {
            gh release upload $tag $file --clobber
          }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
