name: Build Linux

on:
  # Build branches work before this new workflow exists on the default branch.
  push:
    branches: ['codex/electron-build-*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install native build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential python3 libx11-dev libxkbfile-dev libsecret-1-dev

      - name: Install dependencies
        run: npm ci

      - name: Build Linux packages without publishing
        run: npm run electron:build:linux -- --publish never

      - name: Verify packages and calculate checksums
        run: npm run electron:verify -- linux

      - name: Upload Linux packages as build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/SHA256SUMS-linux.txt
          if-no-files-found: error
          retention-days: 30
